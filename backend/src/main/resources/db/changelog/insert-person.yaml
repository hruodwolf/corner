databaseChangeLog:
  - changeSet:
      id: insert-person
      author: init
      changes:
        - loadData:
            file: db/changelog/person.csv
            tableName: person
            encoding: UTF-8
            separator: ","
            columns:
              - column:
                  name: first_name
                  type: string
              - column:
                  name: last_name
                  type: string
