databaseChangeLog:
  - changeSet:
      id: load-records
      author: art
      changes:
        - loadData:
            file: db/changelog/records.csv
            tableName: records
            separator: ","
            encoding: UTF-8
            columns:
              - column:
                  name: record_date
                  type: date
              - column:
                  name: record_value
                  type: numeric
              - column:
                  name: record_category_id
                  type: numeric
              - column:
                  name: unit_id
                  type: numeric
              - column:
                  name: created_by
                  type: string
              - column:
                  name: updated_by
                  type: string
              - column:
                  name: version
                  type: numeric
