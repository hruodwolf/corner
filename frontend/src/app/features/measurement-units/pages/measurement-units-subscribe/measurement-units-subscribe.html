<p>measurement-units-subscribe works!</p>
<div *ngIf="measurementUnits as units">
<p>Example: {{units[0].nameEn}}</p>
  <ul>
    <li *ngFor="let unit of units">{{unit.id}} - {{unit.nameEn}}</li>
  </ul>
</div>
<div *ngIf="measurementUnits?.length as length">
  Sum: {{ length }}
</div>
<div>
<button (click)="pressButton()">Press</button>
<p>Show Number: {{showNumber}}</p>
<button (click)="destroyInterval()">Destroy Interval</button>
<p>Interval: {{countInt}}</p>
</div>
