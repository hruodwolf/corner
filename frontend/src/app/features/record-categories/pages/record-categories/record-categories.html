<h2>Record Categories</h2>

@if (loading()) {
  <div>Lade Daten...</div>
} @else if (error()) {
  <div>{{ error() }}</div>
} @else {
  <ul>
    @for (category of categories(); track category.id) {
      <li>
        {{ category.name }} - {{ category.description }} - {{ category.measurementUnit.nameEn }}
      </li>
    }
  </ul>
}
