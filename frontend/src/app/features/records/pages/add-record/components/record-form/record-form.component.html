<p>record-form works!</p>
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="record-form">
  <mat-form-field appearance="fill">
    <mat-label>Category</mat-label>
    <mat-select formControlName="recordCategory">
      @for (cat of categories; track cat.id) {
        <mat-option [value]="cat">
          {{ cat.name }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Date</mat-label>
    <input matInput [matDatepicker]="picker" formControlName="recordDate" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Value</mat-label>
    <input matInput type="number" formControlName="recordValue" />
  </mat-form-field>

  <!--
  <mat-form-field appearance="fill">
    <mat-label>Unit</mat-label>
    <mat-select formControlName="unitId">
      @for (unit of units; track unit.id) {
        <mat-option [value]="unit.id">
          {{ unit.nameEn }} ({{ unit.symbol }})
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
  -->

  <mat-form-field appearance="fill">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description"></textarea>
  </mat-form-field>

  <button
    mat-stroked-button
    color="warn"
    type="button"
    (click)="onCancel()">
    Cancel
  </button>


  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
    Save
  </button>
</form>
