<p>record-list works!</p>
@if (vm.vm$ | async; as vm) {

  @if (vm.isLoading) {
    <section>Loading...</section>
  } @else {
    <ul>
      @for (item of vm.items; track item.id) {
        <li>
          {{ item.id }} - {{ item.date }} - {{ item.value }}
        </li>
      }
    </ul>
  }

}
<button (click)="vm.refresh()">
  Refresh
</button>
